# 文档仓库侧 .gitlab-ci.yml 示例（B 模式：仓库 CI 编译再推送到 modex）
#
# 推荐做法是直接 include modex 提供的 CI 模板，只设变量即可：
include:
  - remote: 'https://raw.githubusercontent.com/<org>/modex/main/deploy/ci/modex-docs.gitlab-ci.yml'

variables:
  MODEX_MODULE_KEY: "rd-doc"                       # 必填：modex 后台登记的文档源 key
  DOCS_BUILDER:     "vitepress"                    # vitepress | vuepress | fumadocs | markdown
  DOCS_BUILD:       "npm ci && npm run docs:build" # markdown 型可留空
  DOCS_OUTPUT:      "docs/.vitepress/dist"         # 框架 build 产物目录；markdown 型可留空
  MODEX_DEPLOY_URL: "https://modex.example.com/api/deploy"
  # MODEX_DEPLOY_TOKEN: 在 GitLab CI/CD Variables 里设置（Masked + Protected），勿写进仓库

# GitLab 对接说明
# 1. 在 modex 后台登记“文档源”：填 RepoURL + Branch + Type，生成 Deploy Token，
#    并选择它在能力域树中的【锚点节点】（顶层域 / 子域 / 更深子域，深度任意）。
# 2. 把上面的 Deploy Token 作为 GitLab CI 变量 MODEX_DEPLOY_TOKEN（Masked + Protected）。
# 3. 推送到默认分支后，CI 会自动 build + package + deploy 到 modex。
# 4. 文档归属由后台锚点决定，CI 不关心。
# 5. 约束：一个仓库只绑定一个锚点（不跨多个顶层能力域）。编译型仓库整站 single 挂在锚点下；
#    需要把子目录拆成多个子域时，请拆成多个仓库分别绑定，或改用 markdown 型 + split。

name: Feature request
description: Suggest an improvement or new capability for Modex
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: For security issues, use the private process in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like. Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you have tried or other approaches you weighed.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - Frontend / portal
        - Admin console
        - Search / embeddings
        - Deploy / docsctl
        - MCP / skills
        - Docs / ops
        - Other
    validations:
      required: true

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-go:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Prepare dist directory
        run: mkdir -p dist

      # 编译 backend (modex-api)
      - name: Build modex-api
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="modex-api-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          cd backend
          go build -ldflags="-s -w" -o "../dist/${BINARY_NAME}" ./cmd/modex-api

      # 编译 tools/docsctl（被文档仓库 CI 通过 MODEX_DOCSCTL_URL 下载使用）
      - name: Build docsctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="docsctl-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          cd tools/docsctl
          go build -ldflags="-s -w -X main.docsctlVersion=${{ github.ref_name }}" -o "../../dist/${BINARY_NAME}" ./cmd/docsctl

      # 编译 mcp (modex-mcp-server)
      - name: Build modex-mcp-server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="modex-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          cd mcp
          go build -ldflags="-s -w" -o "../dist/${BINARY_NAME}" ./cmd/modex-mcp-server

      - name: Upload Go Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Archive Frontend Output
        run: |
          cd frontend
          zip -r ../modex-frontend.zip .next public package.json package-lock.json -x "node_modules/*" ".git/*"

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-zip
          path: modex-frontend.zip

  create-release:
    name: Create GitHub Release
    needs: [build-go, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release files
        run: |
          mkdir -p final-release
          # 提取所有的 Go 编译产物
          find release-artifacts -type f -name "modex-api-*" -exec cp {} final-release/ \;
          find release-artifacts -type f -name "docsctl-*" -exec cp {} final-release/ \;
          find release-artifacts -type f -name "modex-mcp-server-*" -exec cp {} final-release/ \;
          # 提取前端打包产物
          find release-artifacts -type f -name "modex-frontend.zip" -exec cp {} final-release/ \;
          ls -l final-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

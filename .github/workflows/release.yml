name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docsctl:
    name: Build docsctl Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Prepare dist directory
        run: mkdir -p dist

      # 编译 tools/docsctl（被文档仓库 CI 通过 MODEX_DOCSCTL_URL 下载使用）
      - name: Build docsctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="docsctl-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          cd tools/docsctl
          go build -ldflags="-s -w -X main.docsctlVersion=${{ github.ref_name }}" -o "../../dist/${BINARY_NAME}" ./cmd/docsctl

      - name: Upload docsctl Binaries
        uses: actions/upload-artifact@v4
        with:
          name: docsctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Package MCP npm distribution
        run: npm pack ./mcp/npx --pack-destination .

      - name: Upload MCP npm package
        uses: actions/upload-artifact@v4
        with:
          name: mcp-npm-package
          path: modex-mcp-*.tgz

  publish-images:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
          - name: mcp
            context: mcp
            file: mcp/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  create-release:
    name: Create GitHub Release
    needs: [build-docsctl, build-frontend, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download docsctl artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docsctl-*
          path: release-artifacts

      - name: Download MCP npm package
        uses: actions/download-artifact@v4
        with:
          name: mcp-npm-package
          path: release-artifacts/mcp-npm-package

      - name: Organize release files
        run: |
          mkdir -p final-release
          # 提取 docsctl 二进制（前后端和 MCP 以 GHCR 镜像发布）
          find release-artifacts -type f -name "docsctl-*" -exec cp {} final-release/ \;
          # 提取 MCP npm 分发包，供仍需本地 stdio MCP 的客户端使用
          find release-artifacts -type f -name "modex-mcp-*.tgz" -exec cp {} final-release/ \;
          ls -l final-release

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SPDX SBOM and checksums
        run: |
          syft dir:final-release -o spdx-json=/tmp/modex-release.spdx.json
          mv /tmp/modex-release.spdx.json final-release/modex-release.spdx.json
          cd final-release
          sha256sum * > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts with Sigstore
        working-directory: final-release
        run: |
          for file in *; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: final-release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  go:
    name: Go Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - backend
          - tools/docsctl
          - mcp
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go test -race -cover ./...

  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - backend
          - tools/docsctl
          - mcp
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: golangci-lint ${{ matrix.module }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          working-directory: ${{ matrix.module }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run lint

      - name: Check translation catalogs
        working-directory: frontend
        run: npm run i18n:check

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        working-directory: frontend
        run: npm run e2e

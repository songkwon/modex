# Compose stack for running Modex against externally managed PostgreSQL, Redis,
# and MinIO/S3-compatible object storage.
#
# Required external services:
#   - PostgreSQL with the schema in deploy/db/001_init.sql applied
#   - Redis reachable from the backend container
#   - MinIO/S3-compatible endpoint and bucket credentials
#
# Example:
#   DATABASE_URL='postgres://modex:change-me@postgres.example.com:5432/modex?sslmode=require' \
#   REDIS_URL='redis://redis.example.com:6379/0' \
#   MINIO_ENDPOINT='https://minio.example.com' \
#   MINIO_PUBLIC_ENDPOINT='https://minio.example.com' \
#   MINIO_ROOT_USER='modex' \
#   MINIO_ROOT_PASSWORD='change-me' \
#   MINIO_BUCKET='modex' \
#   docker compose -f docker-compose.external.yml up --build

services:
  meilisearch:
    image: getmeili/meilisearch:v1.9
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-modex-dev-key}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data

  backend:
    build:
      context: ../backend
      args:
        # Container builds do NOT inherit the host proxy, so proxy.golang.org
        # often EOFs. Override with a directly reachable mirror via .env (GOPROXY=...).
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      PORT: ${BACKEND_PORT:-8671}
      DOCS_DEPLOY_MAX_BYTES: ${DOCS_DEPLOY_MAX_BYTES:-536870912}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8671}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3456}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3456}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the external PostgreSQL connection string}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the external Redis connection string}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Set MINIO_ENDPOINT to the external MinIO/S3 endpoint}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Set MINIO_PUBLIC_ENDPOINT to the browser-accessible MinIO/S3 endpoint}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER to the external MinIO/S3 access key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD to the external MinIO/S3 secret key}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET to the external MinIO/S3 bucket}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_PUBLIC_URL: ${MEILISEARCH_PUBLIC_URL:-http://localhost:7700}
      AUTO_LOGIN: ${AUTO_LOGIN:-false}
      SUPER_ADMIN_USERS: ${SUPER_ADMIN_USERS:-}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUTH_URL: ${OIDC_AUTH_URL:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-}
      OIDC_END_SESSION_URL: ${OIDC_END_SESSION_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_CLAIM_UNIQUE_ID: ${OIDC_CLAIM_UNIQUE_ID:-}
      OIDC_CLAIM_AVATAR: ${OIDC_CLAIM_AVATAR:-}
      OIDC_CLAIM_DISPLAY_NAME: ${OIDC_CLAIM_DISPLAY_NAME:-}
      OIDC_CLAIM_SECONDARY_INFO: ${OIDC_CLAIM_SECONDARY_INFO:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-modex_session}
      OAUTH_STATE_COOKIE_NAME: ${OAUTH_STATE_COOKIE_NAME:-modex_oauth_state}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL: ${SESSION_TTL:-8h}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-30s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-60s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-2m}
      HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES:-1048576}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-2097152}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_TOKEN_PER_MINUTE: ${RATE_LIMIT_TOKEN_PER_MINUTE:-30}
      RATE_LIMIT_SEARCH_PER_MINUTE: ${RATE_LIMIT_SEARCH_PER_MINUTE:-60}
      RATE_LIMIT_AI_PER_MINUTE: ${RATE_LIMIT_AI_PER_MINUTE:-20}
      RATE_LIMIT_DEPLOY_PER_MINUTE: ${RATE_LIMIT_DEPLOY_PER_MINUTE:-10}
      HYBRID_KEYWORD_WEIGHT: ${HYBRID_KEYWORD_WEIGHT:-0.6}
      HYBRID_SEMANTIC_WEIGHT: ${HYBRID_SEMANTIC_WEIGHT:-0.4}
      # Directory the backend serves the MCP npx package from (intranet download).
      # The package is bind-mounted read-only below.
      MCP_DIST_DIR: ${MCP_DIST_DIR:-/app/mcp-dist}
      MODEX_SKILL_DIST_DIR: ${MODEX_SKILL_DIST_DIR:-/app/modex-skill}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      # CONFIG_FILE: set this (e.g. to /app/config.yaml) when you mount a config file below.
      # Leave empty or unset to use only environment variables (the old behavior).
      CONFIG_FILE: ${CONFIG_FILE:-}
    ports:
      - "${BACKEND_PORT:-8671}:${BACKEND_PORT:-8671}"
    volumes:
      # MCP npx package served for intranet download (GET /api/mcp/dist/*).
      - ../mcp/npx:/app/mcp-dist:ro
      - ../mcp/skill:/app/modex-skill:ro
      # === Optional Application Config (config.yaml) ===
      # This is the recommended way to configure things like OIDC claim mappings
      # (unique_id_claim, avatar_claim, display_name_claim, secondary_info_claim).
      #
      # Steps to enable:
      #   1. cp deploy/config.example.yaml deploy/config.yaml
      #   2. Edit deploy/config.yaml (especially the auth.user_mapping section)
      #   3. Uncomment the volume mount below
      #   4. Make sure CONFIG_FILE is set to /app/config.yaml (you can put it in your .env)
      #
      # - ./config.yaml:/app/config.yaml:ro
      #
      # You can also mount to other paths and set CONFIG_FILE accordingly, e.g.:
      # - ./my-oidc-config.yaml:/etc/modex/config.yaml:ro
      # and CONFIG_FILE=/etc/modex/config.yaml
      #
      # The app will also auto-discover common locations if CONFIG_FILE is not set.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${BACKEND_PORT:-8671}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      meilisearch:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8671}
        NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_PROJECT_API_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
        NEXT_PUBLIC_POSTHOG_ENABLE_LOCAL: ${POSTHOG_ENABLE_LOCAL:-false}
        # Diagram-as-code (PlantUML/Graphviz/C4/...) render server.
        NEXT_PUBLIC_KROKI_URL: ${NEXT_PUBLIC_KROKI_URL:-http://localhost:8000}
    environment:
      PORT: 3456
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8671}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8671}
      NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_PROJECT_API_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
      NEXT_PUBLIC_POSTHOG_ENABLE_LOCAL: ${POSTHOG_ENABLE_LOCAL:-false}
      NEXT_PUBLIC_KROKI_URL: ${NEXT_PUBLIC_KROKI_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3456}:3456"
    depends_on:
      backend:
        condition: service_healthy

  # MCP server (streamable HTTP JSON-RPC) — proxies tool calls to the backend API.
  # It can be exposed to MCP clients that support remote streamable HTTP:
  #
  #   http://localhost:8787/mcp
  #
  # The npx package (mcp/npx, `npx modex-mcp`) remains available for clients
  # that only support launching local stdio MCP servers.
  mcp:
    build:
      context: ../mcp
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      MODEX_API_BASE_URL: ${MCP_API_BASE_URL:-http://backend:8671}
      MODEX_MCP_TOKEN: ${MODEX_MCP_TOKEN:-}
      MODEX_MCP_TRANSPORT: http
      MODEX_MCP_ADDR: :8787
      MODEX_MCP_PATH: /mcp
    ports:
      - "${MCP_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy

  # Self-hosted Kroki diagram renderer (PlantUML / Graphviz / C4 / DITAA / ...).
  # Runs by default so diagram source stays inside this deployment.
  #
  #   NEXT_PUBLIC_KROKI_URL=http://localhost:8000 docker compose -f docker-compose.external.yml up -d
  #
  # The base yuzutech/kroki image covers PlantUML, Graphviz, C4, DITAA, BPMN,
  # Vega, D2 and more; Mermaid/Excalidraw need companion containers (see kroki docs).
  kroki:
    image: yuzutech/kroki:0.27.1
    ports:
      - "${KROKI_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  meili-data:

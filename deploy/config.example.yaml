# Modex application behavior. Infrastructure, secrets, and ports stay in .env.
# For compose: copy to config.yaml and mount it to /app/config.yaml.

auth:
  user_mapping:
    # Stable user id claim.
    unique_id_claim: email
    # Avatar URL claim.
    avatar_claim: picture
    # Primary display name claim.
    display_name_claim: name
    # Secondary text shown under the name.
    secondary_info_claim: department

search:
  scoring:
    keyword_weight: 0.6
    semantic_weight: 0.4

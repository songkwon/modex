services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modex}
      POSTGRES_USER: ${POSTGRES_USER:-modex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modex} -d ${POSTGRES_DB:-modex}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-modex}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-modex-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.9
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-modex-dev-key}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data

  backend:
    build:
      context: ../backend
      args:
        # Container builds do NOT inherit the host proxy, so proxy.golang.org
        # often EOFs. Override with a directly reachable mirror via .env (GOPROXY=...).
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      PORT: ${BACKEND_PORT:-8671}
      DOCS_DEPLOY_MAX_BYTES: ${DOCS_DEPLOY_MAX_BYTES:-536870912}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8671}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3456}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3456}
      DATABASE_URL: ${DATABASE_URL:-postgres://modex:modex@postgres:5432/modex?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-modex}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-modex-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-modex}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_PUBLIC_URL: ${MEILISEARCH_PUBLIC_URL:-http://localhost:7700}
      AUTH_MODE: ${AUTH_MODE:-mock}
      AUTO_LOGIN: ${AUTO_LOGIN:-false}
      SUPER_ADMIN_USERS: ${SUPER_ADMIN_USERS:-}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUTH_URL: ${OIDC_AUTH_URL:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-}
      OIDC_END_SESSION_URL: ${OIDC_END_SESSION_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-modex_session}
      OAUTH_STATE_COOKIE_NAME: ${OAUTH_STATE_COOKIE_NAME:-modex_oauth_state}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HYBRID_KEYWORD_WEIGHT: ${HYBRID_KEYWORD_WEIGHT:-0.6}
      HYBRID_SEMANTIC_WEIGHT: ${HYBRID_SEMANTIC_WEIGHT:-0.4}
      # Directory the backend serves the MCP npx package from (intranet download).
      # The package is bind-mounted read-only below.
      MCP_DIST_DIR: ${MCP_DIST_DIR:-/app/mcp-dist}
      MODEX_SKILL_DIST_DIR: ${MODEX_SKILL_DIST_DIR:-/app/modex-skill}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      # CONFIG_FILE: set this (e.g. to /app/config.yaml) when you mount a config file below.
      # Leave empty or unset to use only environment variables (the old behavior).
      CONFIG_FILE: ${CONFIG_FILE:-}
    ports:
      - "${BACKEND_PORT:-8671}:${BACKEND_PORT:-8671}"
    volumes:
      # MCP npx package served for intranet download (GET /api/mcp/dist/*).
      - ../mcp/npx:/app/mcp-dist:ro
      - ../mcp/skill:/app/modex-skill:ro
      # === Optional Application Config (config.yaml) ===
      # This is the recommended way to configure things like OIDC claim mappings
      # (unique_id_claim, avatar_claim, display_name_claim, secondary_info_claim).
      #
      # Steps to enable:
      #   1. cp deploy/config.example.yaml deploy/config.yaml
      #   2. Edit deploy/config.yaml (especially the auth.user_mapping section)
      #   3. Uncomment the volume mount below
      #   4. Make sure CONFIG_FILE is set to /app/config.yaml (you can put it in your .env)
      #
      # - ./config.yaml:/app/config.yaml:ro
      #
      # You can also mount to other paths and set CONFIG_FILE accordingly, e.g.:
      # - ./my-oidc-config.yaml:/etc/modex/config.yaml:ro
      # and CONFIG_FILE=/etc/modex/config.yaml
      #
      # The app will also auto-discover common locations if CONFIG_FILE is not set.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${BACKEND_PORT:-8671}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      meilisearch:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8671}
        NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_PROJECT_API_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
        # Diagram-as-code (PlantUML/Graphviz/C4/…) render server. Defaults to the
        # public kroki.io; set to http://localhost:8000 (the `kroki` profile below)
        # to keep diagram source on-prem.
        NEXT_PUBLIC_KROKI_URL: ${NEXT_PUBLIC_KROKI_URL:-https://kroki.io}
    environment:
      PORT: 3456
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8671}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8671}
      NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_PROJECT_API_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
      NEXT_PUBLIC_KROKI_URL: ${NEXT_PUBLIC_KROKI_URL:-https://kroki.io}
    ports:
      - "${FRONTEND_PORT:-3456}:3456"
    depends_on:
      backend:
        condition: service_healthy

  # MCP server (stdio JSON-RPC) — proxies tool calls to the backend API.
  # MCP is a stdio protocol, so it is launched per-session by an AI client
  # rather than served as an always-on port. It builds alongside the stack and
  # is run on demand:
  #
  #   docker compose --profile mcp run --rm mcp
  #
  # Most developers instead use the npx package (mcp/npx, `npx modex-mcp`)
  # pointed at this deployment's backend URL + their personal MCP token.
  mcp:
    build:
      context: ../mcp
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    profiles: ["mcp"]
    environment:
      MODEX_API_BASE_URL: ${MCP_API_BASE_URL:-http://backend:8671}
      MODEX_MCP_TOKEN: ${MODEX_MCP_TOKEN:-}
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_healthy

  # Self-hosted Kroki diagram renderer (PlantUML / Graphviz / C4 / DITAA / …).
  # Optional — only needed if you don't want diagram source sent to public
  # kroki.io. Enable with the `kroki` profile and point the frontend at it:
  #
  #   NEXT_PUBLIC_KROKI_URL=http://localhost:8000 docker compose --profile kroki up -d
  #
  # The base yuzutech/kroki image covers PlantUML, Graphviz, C4, DITAA, BPMN,
  # Vega, D2 and more; Mermaid/Excalidraw need companion containers (see kroki docs).
  kroki:
    image: yuzutech/kroki:0.27.1
    profiles: ["kroki"]
    ports:
      - "${KROKI_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  meili-data:

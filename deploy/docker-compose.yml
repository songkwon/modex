services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modex}
      POSTGRES_USER: ${POSTGRES_USER:-modex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modex}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modex} -d ${POSTGRES_DB:-modex}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-modex}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-modex-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.9
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-modex-dev-key}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data

  backend:
    build:
      context: ../backend
      args:
        # Container builds do NOT inherit the host proxy, so proxy.golang.org
        # often EOFs. Override with a directly reachable mirror via .env (GOPROXY=...).
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      PORT: ${BACKEND_PORT:-8671}
      DOCS_DEPLOY_MAX_BYTES: ${DOCS_DEPLOY_MAX_BYTES:-536870912}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8671}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3456}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3456}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-modex}
      POSTGRES_USER: ${POSTGRES_USER:-modex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modex}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_USER: ${REDIS_USER:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-modex}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-modex-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-modex}
      MINIO_BUCKET_LOOKUP: ${MINIO_BUCKET_LOOKUP:-path}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_TRACE: ${MINIO_TRACE:-false}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_PUBLIC_URL: ${MEILISEARCH_PUBLIC_URL:-http://localhost:7700}
      AUTO_LOGIN: ${AUTO_LOGIN:-false}
      SUPER_ADMIN_USERS: ${SUPER_ADMIN_USERS:-}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUTH_URL: ${OIDC_AUTH_URL:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-}
      OIDC_END_SESSION_URL: ${OIDC_END_SESSION_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-modex_session}
      OAUTH_STATE_COOKIE_NAME: ${OAUTH_STATE_COOKIE_NAME:-modex_oauth_state}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL: ${SESSION_TTL:-8h}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-30s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-60s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-2m}
      HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES:-1048576}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-2097152}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_TOKEN_PER_MINUTE: ${RATE_LIMIT_TOKEN_PER_MINUTE:-30}
      RATE_LIMIT_SEARCH_PER_MINUTE: ${RATE_LIMIT_SEARCH_PER_MINUTE:-60}
      RATE_LIMIT_AI_PER_MINUTE: ${RATE_LIMIT_AI_PER_MINUTE:-20}
      RATE_LIMIT_DEPLOY_PER_MINUTE: ${RATE_LIMIT_DEPLOY_PER_MINUTE:-10}
      # Directory the backend serves the MCP npx package from (intranet download).
      # The package is bind-mounted read-only below.
      MCP_DIST_DIR: ${MCP_DIST_DIR:-/app/mcp-dist}
      MODEX_SKILL_DIST_DIR: ${MODEX_SKILL_DIST_DIR:-/app/modex-skill}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      # Set when mounting deploy/config.yaml below.
      CONFIG_FILE: ${CONFIG_FILE:-}
    ports:
      - "${BACKEND_PORT:-8671}:${BACKEND_PORT:-8671}"
    volumes:
      # MCP npx package served for intranet download (GET /api/mcp/dist/*).
      - ../mcp/npx:/app/mcp-dist:ro
      - ../mcp/skill:/app/modex-skill:ro
      # Optional application behavior config:
      #   cp deploy/config.example.yaml deploy/config.yaml
      #   set CONFIG_FILE=/app/config.yaml
      #   uncomment the mount below
      #
      # - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${BACKEND_PORT:-8671}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      meilisearch:
        condition: service_started

  frontend:
    build:
      context: ../frontend
    environment:
      PORT: 3456
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8671}
      MODEX_PUBLIC_API_BASE_URL: ${MODEX_PUBLIC_API_BASE_URL:-http://localhost:8671}
      MODEX_PUBLIC_POSTHOG_KEY: ${POSTHOG_PROJECT_API_KEY:-}
      MODEX_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
      MODEX_PUBLIC_POSTHOG_ENABLE_LOCAL: ${POSTHOG_ENABLE_LOCAL:-false}
      # Diagram-as-code (PlantUML/Graphviz/C4/…) render server. Defaults to the
      # public kroki.io; set to http://localhost:8000 (the `kroki` profile below)
      # to keep diagram source on-prem.
      MODEX_PUBLIC_KROKI_URL: ${MODEX_PUBLIC_KROKI_URL:-https://kroki.io}
    ports:
      - "${FRONTEND_PORT:-3456}:3456"
    depends_on:
      backend:
        condition: service_healthy

  # MCP server (streamable HTTP JSON-RPC) — proxies tool calls to the backend API.
  # It can be exposed to MCP clients that support remote streamable HTTP:
  #
  #   http://localhost:8787/mcp
  #
  # The npx package (mcp/npx, `npx modex-mcp`) remains available for clients
  # that only support launching local stdio MCP servers.
  mcp:
    build:
      context: ../mcp
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    profiles: ["mcp"]
    environment:
      MODEX_API_BASE_URL: ${MCP_API_BASE_URL:-http://backend:8671}
      MODEX_MCP_TOKEN: ${MODEX_MCP_TOKEN:-}
      MODEX_MCP_TRANSPORT: http
      MODEX_MCP_ADDR: :8787
      MODEX_MCP_PATH: /mcp
    ports:
      - "${MCP_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy

  # Self-hosted Kroki diagram renderer (PlantUML / Graphviz / C4 / DITAA / …).
  # Optional — only needed if you don't want diagram source sent to public
  # kroki.io. Enable with the `kroki` profile and point the frontend at it:
  #
  #   MODEX_PUBLIC_KROKI_URL=http://localhost:8000 docker compose --profile kroki up -d
  #
  # The base yuzutech/kroki image covers PlantUML, Graphviz, C4, DITAA, BPMN,
  # Vega, D2 and more; Mermaid/Excalidraw need companion containers (see kroki docs).
  kroki:
    image: yuzutech/kroki:0.27.1
    profiles: ["kroki"]
    ports:
      - "${KROKI_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  meili-data:

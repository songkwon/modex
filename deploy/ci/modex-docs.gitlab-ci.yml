# Modex docs deploy template.
# Usage and optional variables: deploy/ci/modex-docs.md

variables:
  DOCS_VERSION: "latest"
  DOCS_SOURCE_DIR: "."
  MODEX_DOCS_IMAGE: "node:20-bookworm"
  MODEX_DOCSCTL_URL: "https://github.com/modex/modex/releases/latest/download/docsctl-linux-amd64"

.modex-docs-base:
  image: "$MODEX_DOCS_IMAGE"
  variables:
    DOCS_DEPLOY_URL: "$MODEX_DEPLOY_URL"
    DOCS_DEPLOY_TOKEN: "$MODEX_DEPLOY_TOKEN"
    DOCS_REPO_URL: "$CI_PROJECT_URL"
    DOCS_REPO_TYPE: "git"
    DOCS_BRANCH: "$CI_COMMIT_REF_NAME"
    DOCS_COMMIT_SHA: "$CI_COMMIT_SHA"
  before_script:
    - 'test -n "$MODEX_DEPLOY_URL" || { echo "MODEX_DEPLOY_URL 未设置"; exit 1; }'
    - 'test -n "$MODEX_DEPLOY_TOKEN" || { echo "MODEX_DEPLOY_TOKEN 未设置"; exit 1; }'
    - 'curl -fsSL "$MODEX_DOCSCTL_URL" -o /usr/local/bin/docsctl'
    - 'chmod +x /usr/local/bin/docsctl'
    - 'docsctl version || true'
  script:
    - docsctl validate
    - docsctl build
    - docsctl package
    - docsctl deploy

modex-docs-deploy:
  extends: .modex-docs-base
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
